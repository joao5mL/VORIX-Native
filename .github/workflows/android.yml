
name: Build VORIX APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Command Line Tools
        run: |
          set -e

          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/android-tools.zip"

          mkdir -p "$RUNNER_TEMP/android-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"

          mkdir -p "$SDK/cmdline-tools/latest"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools/"* \
             "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract VORIX project
        run: |
          unzip -q VORIX-Native-Project.zip -d extracted

          echo "Conteúdo extraído:"
          find extracted -maxdepth 3 -type f

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Estrutura do projeto não encontrada no ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VORIX-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
